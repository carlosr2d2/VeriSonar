# Copiar a secret.yaml y rellenar. No versionar valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: verisonar-secrets
  namespace: verisonar
type: Opaque
stringData:
  SECRET_KEY: cambiar
  POSTGRES_USER: verisonar
  POSTGRES_PASSWORD: cambiar
  DATABASE_URL: postgresql+psycopg://verisonar:cambiar@postgres:5432/verisonar
  FCM_SERVER_KEY: ""
  BOOTSTRAP_ADMIN_EMAIL: admin@verisonar.local
  BOOTSTRAP_ADMIN_PASSWORD: cambiar
