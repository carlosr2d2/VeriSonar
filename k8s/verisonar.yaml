apiVersion: v1
kind: Namespace
metadata:
  name: verisonar
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verisonar-config
  namespace: verisonar
data:
  APP_ENV: "production"
  PROCESSING_MODE: "online"
  DEFAULT_LOCALE: "es"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "verisonar"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  UPLOAD_DIR: "/data/uploads"
  REPORT_DIR: "/data/reports"
  MODEL_DIR: "/data/models"
  API_INTERNAL_URL: "http://backend:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: verisonar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: verisonar/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: verisonar-config
            - secretRef:
                name: verisonar-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verisonar-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: verisonar
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: verisonar/backend:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "-Q", "audio,reports,maintenance"]
          envFrom:
            - configMapRef:
                name: verisonar-config
            - secretRef:
                name: verisonar-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verisonar-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: verisonar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: verisonar/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: http://backend:8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: verisonar
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: verisonar
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: verisonar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: verisonar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verisonar
  namespace: verisonar
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "80m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: verisonar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verisonar-data
  namespace: verisonar
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
